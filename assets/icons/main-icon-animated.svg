<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background definition for smooth rendering as a favicon/icon -->
  <defs>
    <!-- Clean, dark background matching standard modern dev terminals -->
    <style>
      .bg { fill: #1e1e2e; rx: 16px; }
      .hex-outer { fill: none; stroke: #89b4fa; stroke-width: 4; stroke-linejoin: round; }
      .hex-inner { fill: none; stroke: #cdd6f4; stroke-width: 2; opacity: 0.3; stroke-linejoin: round; }
      .code-symbol { fill: #f5c2e7; font-family: monospace; font-weight: bold; font-size: 24px; text-anchor: middle; dominant-baseline: central; }
      .cursor { fill: #a6e3a1; animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Icon Container Background -->
  <rect width="100%" height="100%" class="bg"/>

  <!-- Concentric Inner Decorative Hexagon -->
  <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" class="hex-inner" />

  <!-- Outer Sharp Geometric Hexagon -->
  <polygon points="50,15 80,32.5 80,67.5 50,85 20,67.5 20,32.5" class="hex-outer" />

  <!-- Centered Devlog Typography Element -->
  <!-- Combines a forward slash / and a terminal cursor box for a modern coding look -->
  <g transform="translate(50, 50)">
    <text x="-4" y="0" class="code-symbol">/</text>
    <!-- Terminal Prompt Terminal Cursor Element -->
    <rect x="6" y="-7" width="8" height="16" class="cursor" />
  </g>
</svg>
